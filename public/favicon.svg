<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="5" height="5">
  <title>Logo Ludo - dado</title>
  <desc>Versão vetorial do logo, com fundo circular dourado e dado branco.</desc>

  <!-- Fundo -->
  <circle cx="540" cy="540" r="540" fill="#E7AD4A"/>

  <!-- Dado -->
  <g fill="#FFFFFF" stroke="#E7AD4A" stroke-width="10" stroke-linejoin="round">
    <!-- Face frontal -->
    <polygon points="215,459 658,350 778,786 344,886"/>
    <!-- Face superior -->
    <polygon points="334,285 744,198 658,350 215,459"/>
    <!-- Face direita -->
    <polygon points="744,198 872,620 778,786 658,350"/>
  </g>

  <!-- Pontos da face superior -->
  <g fill="#E7AD4A">
    <ellipse cx="304" cy="414" rx="51" ry="17" transform="rotate(-17 304 414)"/>
    <ellipse cx="480" cy="320" rx="51" ry="17" transform="rotate(-17 480 320)"/>
    <ellipse cx="663" cy="234" rx="51" ry="17" transform="rotate(-17 663 234)"/>
  </g>

  <!-- Ponto da face frontal -->
  <circle cx="488" cy="623" r="60" fill="#E7AD4A"/>

  <!-- Pontos da face direita -->
  <g fill="#E7AD4A">
    <ellipse cx="762" cy="304" rx="17" ry="42" transform="rotate(-6 762 304)"/>
    <ellipse cx="782" cy="678" rx="17" ry="42" transform="rotate(-6 782 678)"/>
  </g>
</svg>
